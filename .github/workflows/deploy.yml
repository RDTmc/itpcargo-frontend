name: Deploy Frontend to EC2

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Descargar ultima imagen de ECR
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin 791990722630.dkr.ecr.us-east-1.amazonaws.com

            docker pull 791990722630.dkr.ecr.us-east-1.amazonaws.com/itpcargo-frontend:latest

            # Detener contenedor anterior
            docker stop itpcargo-frontend || true
            docker rm itpcargo-frontend || true

            # Levantar nuevo contenedor
            docker run -d \
              --name itpcargo-frontend \
              --restart unless-stopped \
              -p 80:80 \
              791990722630.dkr.ecr.us-east-1.amazonaws.com/itpcargo-frontend:latest

            # Limpiar imagenes antiguas
            docker system prune -f

            echo "Deploy completado"
            docker ps | grep itpcargo-frontend
