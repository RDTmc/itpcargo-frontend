name: Build and Deploy Frontend to EC2

on:
  push:
    branches: [deploy]

jobs:
  build-and-deploy:
    name: Build, Push to Docker Hub, Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-frontend:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login Docker Hub en EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Descargar imagen de Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-frontend:latest

            # Detener contenedor anterior
            docker stop itpcargo-frontend 2>/dev/null; docker rm itpcargo-frontend 2>/dev/null

            # Levantar nuevo contenedor (puerto 80 host → 8080 contenedor)
            docker run -d \
              --name itpcargo-frontend \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-frontend:latest

            # Limpiar imagenes antiguas
            docker system prune -f

            echo "Deploy completado"
            docker ps --filter name=itpcargo-frontend
