name: Deploy Frontend to EC2

on:
  push:
    branches: [deploy]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: itpcargo-frontend

jobs:
  build-and-deploy:
    name: Build, Push to ECR, and Deploy
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1. Checkout del código
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 2. Configurar credenciales AWS
      # ============================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # 3. Login a ECR
      # ============================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 4. Build y push de imagen Docker
      # ============================================
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Imagen subida: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # ============================================
      # 5. Deploy en EC2 vía SSH
      # ============================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login a ECR desde EC2
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}

            # Descargar nueva imagen
            docker pull 791990722630.dkr.ecr.us-east-1.amazonaws.com/itpcargo-frontend:latest

            # Detener contenedor anterior
            docker stop itpcargo-frontend || true
            docker rm itpcargo-frontend || true

            # Levantar nuevo contenedor
            docker run -d \
              --name itpcargo-frontend \
              --restart unless-stopped \
              -p 80:80 \
              791990722630.dkr.ecr.us-east-1.amazonaws.com/itpcargo-frontend:latest

            # Limpiar imágenes antiguas
            docker system prune -f
